name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # tauri::generate_context! embeds the built frontend, so dist must exist
      # before the Rust crates compile.
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Install Rust
        # Version and components come from rust-toolchain.toml.
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Deliberately NOT run with elevated privileges. The
      # test_suite_does_not_run_as_root invariant asserts this: running as
      # root would mask a probe that silently requires elevation
      # (TECH_DECISIONS.md ADR-002).
      - name: Test
        run: cargo test --workspace --all-targets

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run build
