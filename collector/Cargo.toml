# jrx-collector — platform probes. The only OS-facing code in the system.
#
# ARCHITECTURE.md §4: this crate MUST NOT depend on Tauri. It exposes a
# transport-agnostic API so the same crate can later be wrapped in a daemon
# without touching core or the UI (ARCHITECTURE.md §15).
[package]
name = "jrx-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
jrx-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mdns-sd = { version = "0.21", default-features = false }

[features]
# Development only. A release build with this enabled fails to compile.
fixtures = []

[lints]
workspace = true

# CoreLocation is the only way to ask macOS whether Location Services is
# authorised, which the Wi-Fi network name depends on. Confined to
# macos/permissions.rs (TECH_DECISIONS.md ADR-006).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
