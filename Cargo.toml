[workspace]
resolver = "3"
members = ["core", "collector", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
repository = "https://github.com/NaZaR228wate/JRX-Network-Observatory"

[workspace.dependencies]
jrx-core = { path = "core" }
jrx-collector = { path = "collector" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
